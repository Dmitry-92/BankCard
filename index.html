<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма для кредитной карты</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card-container">
        <div class="card">
            <!-- Оранжевая полоса поверх заголовка -->
            <div class="card-header">
                <h2 class="card-title">CREDIT CARD DETAILS</h2>
            </div>

            <div class="card-body">

                <form id="creditCardForm">
                    <!-- Номер карты -->
                    <div class="form-group">
                        <label for="cardNumber">Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
                    </div>

                    <!-- Имя владельца -->
                    <div class="form-group">
                        <label for="cardHolder">Name On Card</label>
                        <input type="text" id="cardHolder" placeholder="Name Surname" maxlength="30">
                    </div>

                    <!-- Срок действия и CVV -->
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="expiryDate">Expiry Date</label>
                            <input type="text" id="expiryDate" placeholder="MM / YY" maxlength="7">
                        </div>
                        <div class="form-group half">
                            <label for="cvv">CVV / CVN</label>
                            <input type="password" id="cvv" placeholder="***" maxlength="3">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
