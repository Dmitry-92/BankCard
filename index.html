<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма для кредитной карты</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Форма для кредитной карты</h1>

    <!-- Здесь будет форма -->
    <div class="card-container">
        <div class="card">
            <!-- Оранжевая полоса -->
            <div class="card-header"></div>

            <form id="creditCardForm">

                <!-- Номер кредитной карты -->
                <div class="form-group">
                    <label for="cardNumber">Номер карты</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>

                <!-- Имя владельца -->
                <div class="form-group">
                    <label for="cardHolder">Имя владельца</label>
                    <input type="text" id="cardHolder" placeholder="IVAN IVANOV" maxlength="30">
                </div>

                <!-- Срок действия и CVV -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="expiryDate">Срок действия</label>
                        <input type="text" id="expiryDate" placeholder="ММ / ГГ" maxlength="7">
                    </div>
                    <div class="form-group half">
                        <label for="cvv">CVV / CVN</label>
                        <input type="password" id="cvv" placeholder="***" maxlength="3">
                    </div>
                    <!-- Кнопка отправки -->
                    <button type="submit" class="submit-btn">Оплатить</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
